<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rizwan Store</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{background:#111;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:12px;padding:10px;box-shadow:0 2px 8px #0001;text-align:center}
.card img{width:100%;border-radius:10px}
.btn{background:#000;color:#fff;border:none;padding:10px 15px;border-radius:8px;width:100%;margin-top:8px}
</style>
</head>
<body>
<div class="header">Rizwan Store | FamGateway</div>
<div class="grid">
{% for p in products %}
<div class="card">
<img src="{{p.image}}">
<h3>{{p.name}}</h3>
<p>Rs.{{p.price}}</p>
<form method="post" action="/order"><button class="btn">Order Now</button></form>
</div>
{% endfor %}
</div>
</body>
</html>
